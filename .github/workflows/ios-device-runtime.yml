name: iOS Device Runtime Test Host (unsigned IPA)

# Builds a REAL iOS arm64 device app that exercises the published LuaJITHost
# on a physical iPhone via ESign. This workflow only builds/packages; it does
# NOT claim device runtime success. Manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  LUAJIT_COMMIT: '96f7b297326e9fd454b7186c6858b2773f94a0dc'
  LUAJIT_ARTIFACT_ID: '14855513382'
  LUAJIT_ZIP_SHA: '58ff22c6ebe8019ff0f11679e81df93c4a1052605daefdb9fae935d5d724f595'
  LUAJIT_LIB_SHA: '6b3c087831456891cf572f56aa9127b9539507b32c1552582eaf87c6deb31343'

jobs:
  build-device-test-host:
    name: iOS arm64 device test host (unsigned IPA)
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record Apple toolchain
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "uname -m: $(uname -m)"
            sw_vers
            echo "xcode-select: $(xcode-select -p)"
            xcodebuild -version
            echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
            echo "iphoneos SDK path: $(xcrun --sdk iphoneos --show-sdk-path)"
            clang --version | head -1
            cmake --version | head -1
          } 2>&1 | tee ci/toolchain-report.txt
          # Build host is Intel x86_64; the TARGET stays arm64-apple-ios15.0 via
          # ARCHS=arm64 / SDKROOT=iphoneos in the Xcode project.
          [[ "$(uname -m)" == "x86_64" ]] || { echo "ERROR: expected x86_64 Intel runner" >&2; exit 1; }
          cat ci/toolchain-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify pinned device artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci/luajit
          # Only LuaJIT is a pinned external dependency here. The Core archive
          # MUST be rebuilt from the current checkout (see next step); using an
          # older Core artifact causes missing A-E symbols at link time.
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${LUAJIT_ARTIFACT_ID}/zip" \
            > ci/luajit/artifact.zip
          echo "$(shasum -a 256 ci/luajit/artifact.zip | awk '{print $1}')  luajit zip" > ci/artifact-sha.txt
          grep -q "^${LUAJIT_ZIP_SHA}  luajit zip$" ci/artifact-sha.txt
          unzip -o -q ci/luajit/artifact.zip -d ci/luajit
          test -f ci/luajit/libluajit.a
          echo "$(shasum -a 256 ci/luajit/libluajit.a | awk '{print $1}')  libluajit.a" >> ci/artifact-sha.txt
          grep -q "^${LUAJIT_LIB_SHA}  libluajit.a$" ci/artifact-sha.txt
          cat ci/artifact-sha.txt

      - name: Prepare LuaJIT headers from pinned commit
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/LuaJIT/LuaJIT.git ci/luajit-src
          git -C ci/luajit-src checkout --quiet "$LUAJIT_COMMIT"
          ACTUAL="$(git -C ci/luajit-src rev-parse HEAD)"
          [[ "$ACTUAL" == "$LUAJIT_COMMIT" ]] || { echo "ERROR: LuaJIT commit mismatch: $ACTUAL" >&2; exit 1; }
          export MACOSX_DEPLOYMENT_TARGET=11.0
          make -C ci/luajit-src/src -j2 luajit.h HOST_CC=clang
          for h in lua.h luaconf.h lauxlib.h lualib.h luajit.h; do
            test -f "ci/luajit-src/src/$h" || { echo "ERROR: missing header $h" >&2; exit 1; }
          done
          EXPECTED_SYM="$(awk '/^#define LUAJIT_VERSION_SYM/ {print $3}' ci/luajit-src/src/luajit.h)"
          [[ -n "$EXPECTED_SYM" ]] || { echo "ERROR: LUAJIT_VERSION_SYM not found in generated luajit.h" >&2; exit 1; }
          # Never pipe nm into grep -q under pipefail: grep closes the pipe early
          # and LLVM nm dies with SIGPIPE. Materialize the full output first.
          nm -g ci/luajit/libluajit.a > "$RUNNER_TEMP/luajit-symbols.txt"
          grep -Fq "$EXPECTED_SYM" "$RUNNER_TEMP/luajit-symbols.txt"
          echo "LUAJIT_INCLUDE_DIR=$GITHUB_WORKSPACE/ci/luajit-src/src" >> "$GITHUB_ENV"
          echo "LUAJIT_LIB=$GITHUB_WORKSPACE/ci/luajit/libluajit.a" >> "$GITHUB_ENV"

      - name: Build Core from current checkout (iOS arm64, LuaJIT ON)
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "$SOURCE_SHA" > ci/core-source-sha.txt
          [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]] || {
            echo "ERROR: checkout SHA $SOURCE_SHA differs from GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          }

          # Same target as the device app: arm64-apple-ios15.0, iphoneos SDK.
          # LuaJIT is the pinned platform-2 archive; headers come from the
          # pinned LuaJIT commit. No stale Core archive is used as input.
          cmake -S . -B ci/build-core \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIZONA_NEO_WITH_LUAJIT=ON \
            -DLUAJIT_INCLUDE_DIR="$LUAJIT_INCLUDE_DIR" \
            -DLUAJIT_LIBRARY="$LUAJIT_LIB" 2>&1 | tee ci/core-configure.log
          cmake --build ci/build-core --target arizona_neo_core --parallel 2 2>&1 | tee ci/core-build.log

          CORE_LIB="$GITHUB_WORKSPACE/ci/build-core/libarizona_neo_core.a"
          test -f "$CORE_LIB"
          file "$CORE_LIB" | tee ci/core-binary-info.txt
          lipo -info "$CORE_LIB" | tee -a ci/core-binary-info.txt
          mkdir -p ci/core-verify
          (cd ci/core-verify && ar x "$CORE_LIB" lua_jit_host.cpp.o)
          otool -l ci/core-verify/lua_jit_host.cpp.o \
            | grep -A4 'cmd LC_BUILD_VERSION' > ci/core-build-version.txt
          cat ci/core-build-version.txt
          grep -q 'platform 2' ci/core-build-version.txt    # IOS device, not simulator (7)
          grep -q 'minos 15.0' ci/core-build-version.txt
          nm -g "$CORE_LIB" > ci/core-symbols.txt             # full output first, no SIGPIPE
          grep -Fq 'LuaJITHost' ci/core-symbols.txt
          grep -Fq 'execute_detailed' ci/core-symbols.txt
          grep -Fq 'register_function' ci/core-symbols.txt
          # Stage 11: build the standalone iOS bootstrap dylib from the same
          # freshly built Core, not from a prebuilt artifact.
          cmake --build ci/build-core --target neo_loader_bootstrap --parallel 2 2>&1 | tee ci/bootstrap-build.log
          BOOTSTRAP_DYLIB="$GITHUB_WORKSPACE/ci/build-core/libNeoLoaderBootstrap.dylib"
          test -f "$BOOTSTRAP_DYLIB"
          file "$BOOTSTRAP_DYLIB" | tee ci/bootstrap-binary-info.txt
          lipo -info "$BOOTSTRAP_DYLIB" | tee -a ci/bootstrap-binary-info.txt
          otool -l "$BOOTSTRAP_DYLIB" | grep -A4 'cmd LC_BUILD_VERSION' > ci/bootstrap-build-version.txt
          grep -q 'platform 2' ci/bootstrap-build-version.txt
          grep -q 'minos 15.0' ci/bootstrap-build-version.txt
          nm -g "$BOOTSTRAP_DYLIB" > ci/bootstrap-symbols.txt
          grep -Fq '_neo_bootstrap_initialize' ci/bootstrap-symbols.txt
          grep -Fq '_neo_bootstrap_shutdown' ci/bootstrap-symbols.txt
          grep -Fq '_neo_bootstrap_get_status' ci/bootstrap-symbols.txt
          grep -Fq '_neo_bootstrap_get_version' ci/bootstrap-symbols.txt
          grep -Fq '_neo_bootstrap_attach_host' ci/bootstrap-symbols.txt
          grep -Fq '_neo_bootstrap_get_marker_path' ci/bootstrap-symbols.txt
          otool -l "$BOOTSTRAP_DYLIB" > "$RUNNER_TEMP/bootstrap-load-commands.txt"
          cp "$RUNNER_TEMP/bootstrap-load-commands.txt" ci/bootstrap-load-commands.txt
          grep -Eq '__mod_init_func|__init_offsets' "$RUNNER_TEMP/bootstrap-load-commands.txt"
          shasum -a 256 "$BOOTSTRAP_DYLIB" | awk '{print $1}' > ci/bootstrap-sha256.txt
          cat ci/bootstrap-sha256.txt
          echo "BOOTSTRAP_DYLIB=$BOOTSTRAP_DYLIB" >> "$GITHUB_ENV"

          echo "CORE_LIB=$CORE_LIB" >> "$GITHUB_ENV"
          echo "FRESH_CORE_BUILD_OK from $SOURCE_SHA"

      - name: Upload bootstrap diagnostics (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-debug
          path: |
            ci/build-core/libNeoLoaderBootstrap.dylib
            ci/bootstrap-load-commands.txt
            ci/bootstrap-symbols.txt

      - name: Build unsigned iOS device test app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project tests/ios_device/DeviceTestHost.xcodeproj \
            -scheme DeviceTestHost \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ci/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CORE_LIB="$CORE_LIB" \
            LUAJIT_LIB="$LUAJIT_LIB" \
            LUAJIT_INCLUDE_DIR="$LUAJIT_INCLUDE_DIR" 2>&1 | tee ci/xcodebuild.log
          APPS="$(find "$PWD/ci/derived/Build/Products" -type d -name DeviceTestHost.app)"
          COUNT="$(printf '%s\n' "$APPS" | grep -c . || true)"
          [[ "$COUNT" -eq 1 ]] || { echo "ERROR: expected one .app, found $COUNT" >&2; echo "$APPS" >&2; exit 1; }
          echo "DEVICE_APP=$APPS" >> "$GITHUB_ENV"
          echo "DEVICE_APP_BUILT"

      - name: Verify device Mach-O, platform and symbols
        run: |
          set -euo pipefail
          BIN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$DEVICE_APP/Info.plist")"
          DEVICE_BIN="$DEVICE_APP/$BIN"
          test -f "$DEVICE_BIN"
          file "$DEVICE_BIN" | tee ci/device-binary-info.txt
          file "$DEVICE_BIN" | grep -q 'Mach-O'
          otool -hv "$DEVICE_BIN" | tee -a ci/device-binary-info.txt | grep -q 'ARM64'
          lipo -info "$DEVICE_BIN" | tee -a ci/device-binary-info.txt
          otool -l "$DEVICE_BIN" | grep -A4 'cmd LC_BUILD_VERSION' > ci/device-build-version.txt
          cat ci/device-build-version.txt
          grep -q 'platform 2' ci/device-build-version.txt   # IOS device, not simulator (7)
          grep -q 'minos 15.0' ci/device-build-version.txt
          nm -g "$DEVICE_BIN" > ci/device-symbols.txt
          grep -Fq 'LuaJITHost' ci/device-symbols.txt
          grep -Fq 'luaL_newstate' ci/device-symbols.txt
          grep -Fq 'execute_detailed' ci/device-symbols.txt
          grep -Fq 'register_function' ci/device-symbols.txt
          echo "DEVICE_BINARY_OK"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          bash scripts/package_unsigned_ipa.sh \
            "$DEVICE_APP" \
            "$PWD/ci/ArizonaNeoDeviceTest-unsigned.ipa" \
            "$PWD/ci/ipa-sha256.txt" 2>&1 | tee ci/package.log
          test -f ci/ArizonaNeoDeviceTest-unsigned.ipa
          shasum -a 256 \
            ci/ArizonaNeoDeviceTest-unsigned.ipa \
            ci/luajit/libluajit.a \
            "$CORE_LIB" \
            ci/core-source-sha.txt \
            ci/toolchain-report.txt \
            ci/artifact-sha.txt \
            ci/device-binary-info.txt \
            ci/device-build-version.txt \
            ci/device-symbols.txt \
            ci/build-core/libNeoLoaderBootstrap.dylib \
            ci/bootstrap-binary-info.txt \
            ci/bootstrap-build-version.txt \
            ci/bootstrap-symbols.txt \
            ci/bootstrap-sha256.txt > ci/sha256-manifest.txt
          cat ci/sha256-manifest.txt
          echo "- iOS device build: PASS (unsigned IPA; device runtime NOT executed)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-luajit-test-host
          retention-days: 30
          if-no-files-found: error
          path: |
            ci/ArizonaNeoDeviceTest-unsigned.ipa
            ci/ipa-sha256.txt
            ci/sha256-manifest.txt
            ci/toolchain-report.txt
            ci/artifact-sha.txt
            ci/core-source-sha.txt
            ci/core-configure.log
            ci/core-build.log
            ci/core-binary-info.txt
            ci/core-build-version.txt
            ci/core-symbols.txt
            ci/xcodebuild.log
            ci/package.log
            ci/device-binary-info.txt
            ci/device-build-version.txt
            ci/device-symbols.txt
            ci/build-core/libNeoLoaderBootstrap.dylib
            ci/bootstrap-binary-info.txt
            ci/bootstrap-build-version.txt
            ci/bootstrap-symbols.txt
            ci/bootstrap-sha256.txt
