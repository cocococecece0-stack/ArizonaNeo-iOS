name: iOS Simulator LuaJIT Runtime

# ACTUAL runtime validation: builds LuaJIT 2.1 for the iOS Simulator, links the
# integrated LuaJITHost and EXECUTES the test binary inside a booted iOS
# Simulator via `xcrun simctl spawn`. Does not touch the device workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LUAJIT_COMMIT: '96f7b297326e9fd454b7186c6858b2773f94a0dc'
  IOS_SIM_DEPLOYMENT_TARGET: '15.0'

jobs:
  simulator-runtime:
    name: iOS Simulator arm64 - LuaJITHost runtime
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record Apple toolchain and select Simulator runtime
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          echo "Simulator SDK version: $(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "Simulator SDK path: $(xcrun --sdk iphonesimulator --show-sdk-path)"
          clang --version | head -1
          cmake --version | head -1
          mkdir -p ci
          xcrun simctl list devices available -j > ci/simulator-devices.json
          UDID="$(python3 - <<'PY'
          import json
          d = json.loads(open('ci/simulator-devices.json').read())
          for runtime, devices in d.get('devices', {}).items():
              if 'iOS 18-' not in runtime:
                  continue
              for dev in devices:
                  if dev.get('isAvailable') and dev.get('name', '').startswith('iPhone'):
                      print(dev['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone Simulator with iOS 18.x')
          PY
          )"
          test -n "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true   # already booted is fine
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices "$UDID" | tee ci/simulator-device.txt
          {
            echo "## iOS Simulator toolchain"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo "- Device UDID: $UDID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build LuaJIT for iOS Simulator (pinned commit, JIT off, FFI on)
        env:
          LUAJIT_SIM_WORK_DIR: ${{ github.workspace }}/ci/luajit-sim
        run: |
          set -euo pipefail
          test -x scripts/build_luajit_ios_simulator.sh
          bash scripts/build_luajit_ios_simulator.sh 2>&1 | tee ci/luajit-sim-build.log
          LUAJIT_LIB="$GITHUB_WORKSPACE/ci/luajit-sim/out-ios-simulator-arm64/libluajit.a"
          LUAJIT_INCLUDE_DIR="$GITHUB_WORKSPACE/ci/luajit-sim/LuaJIT-${LUAJIT_COMMIT}/src"
          test -f "$LUAJIT_LIB"
          echo "LUAJIT_LIB=$LUAJIT_LIB" >> "$GITHUB_ENV"
          echo "LUAJIT_INCLUDE_DIR=$LUAJIT_INCLUDE_DIR" >> "$GITHUB_ENV"

      - name: Build ArizonaNeo Core for iOS Simulator (LuaJIT ON)
        run: |
          set -euo pipefail
          cmake -S . -B ci/build-sim-core \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_SIM_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DARIZONA_NEO_WITH_LUAJIT=ON \
            -DLUAJIT_INCLUDE_DIR="$LUAJIT_INCLUDE_DIR" \
            -DLUAJIT_LIBRARY="$LUAJIT_LIB" 2>&1 | tee ci/sim-core-configure.log
          cmake --build ci/build-sim-core --target arizona_neo_core --parallel 2 2>&1 | tee ci/sim-core-build.log
          nm -g ci/build-sim-core/libarizona_neo_core.a > ci/sim-core-nm.txt
          grep -q 'LuaJITHost' ci/sim-core-nm.txt
          echo "SIM_CORE_BUILD_OK"

      - name: Build and run XCTest suite INSIDE the iOS Simulator
        run: |
          set -euo pipefail
          # xcodebuild test installs and launches the XCTest runner process in
          # the selected Simulator. The .xcresult bundle is the authoritative
          # result; a crash, timeout or missing report yields a non-zero exit.
          set +e
          xcodebuild test \
            -project tests/ios_simulator/SimRuntimeTests.xcodeproj \
            -scheme SimRuntimeTests \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$PWD/ci/derived" \
            -resultBundlePath "$PWD/ci/SimRuntimeTests.xcresult" \
            CORE_LIB="$GITHUB_WORKSPACE/ci/build-sim-core/libarizona_neo_core.a" \
            LUAJIT_LIB="$LUAJIT_LIB" \
            LUAJIT_INCLUDE_DIR="$LUAJIT_INCLUDE_DIR" 2>&1 | tee ci/xcodebuild-test.log
          XCODE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "xcodebuild test exit: $XCODE_EXIT"
          cat ci/xcodebuild-test.log
          test "$XCODE_EXIT" -eq 0
          test -d ci/SimRuntimeTests.xcresult
          EXECUTED="$(grep -Eo 'Executed [0-9]+ tests' ci/xcodebuild-test.log | head -1 | awk '{print $2}' || true)"
          test -n "$EXECUTED" && test "$EXECUTED" -gt 0
          if grep -Eq 'with [1-9][0-9]* failures?|Test Suite .* failed' ci/xcodebuild-test.log; then
            echo "ERROR: XCTest reported failures" >&2
            exit 1
          fi
          {
            echo "## iOS Simulator XCTest runtime results"
            echo "- xcodebuild test exit: $XCODE_EXIT"
            echo "- Tests executed: $EXECUTED"
            echo "- Simulator UDID: $SIM_UDID"
            grep -E 'Test Case|Test Suite|Executed' ci/xcodebuild-test.log
          } > ci/test-report.txt
          cat ci/test-report.txt
          cat ci/test-report.txt >> "$GITHUB_STEP_SUMMARY"
          MATCHES="$(find "$PWD/ci/derived" -type f -name SimRuntimeTests -perm -u+x)"
          COUNT="$(printf '%s\n' "$MATCHES" | grep -c . || true)"
          if [[ "$COUNT" -ne 1 ]]; then
            echo "ERROR: expected exactly one SimRuntimeTests test-runner binary, found $COUNT" >&2
            echo "$MATCHES" >&2
            exit 1
          fi
          echo "SIM_TEST_BIN=$MATCHES" >> "$GITHUB_ENV"
          otool -l "$MATCHES" | grep -A4 'cmd LC_BUILD_VERSION' > ci/sim-test-platform.txt
          cat ci/sim-test-platform.txt
          grep -q 'platform 7' ci/sim-test-platform.txt    # IOSSIMULATOR, not IOS (2)
          grep -q 'minos 15.0' ci/sim-test-platform.txt
          echo "SIMULATOR_RUNTIME_OK"

      - name: Binary inspection, SHA256 manifest and artifacts
        run: |
          set -euo pipefail
          {
            for f in "$LUAJIT_LIB" \
                     "$GITHUB_WORKSPACE/ci/build-sim-core/libarizona_neo_core.a" \
                     "$SIM_TEST_BIN"; do
              echo "===== $f ====="
              file "$f"
              lipo -info "$f"
              otool -hv "$f" | head -12
              otool -l "$f" | grep -A4 'cmd LC_BUILD_VERSION' | head -12 || true
              nm -g "$f" | grep -E ' T _?(luaL_newstate|lua_pcall|lua_close|luaopen_ffi|luaJIT_version)' | head -8 || true
            done
            echo "===== forbidden dependencies ====="
            if grep -Ei 'ELF|__errno_location|__android_|JNIEnv|Java_|libdl\.so|/lib/ld-linux' ci/*.log ci/test-report.txt; then
              echo "ERROR: Linux/Android dependency found" >&2
              exit 1
            fi
            echo "NONE: no ELF / glibc / Bionic / JNI / libdl.so references"
          } > ci/binary-inspection-report.txt 2>&1
          cat ci/binary-inspection-report.txt
          shasum -a 256 \
            "$LUAJIT_LIB" \
            ci/build-sim-core/libarizona_neo_core.a \
            "$SIM_TEST_BIN" \
            ci/xcodebuild-test.log \
            ci/test-report.txt \
            ci/binary-inspection-report.txt > ci/sha256-manifest.txt
          cat ci/sha256-manifest.txt

      - name: Upload Simulator runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-luajit-runtime
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.LUAJIT_LIB }}
            ci/build-sim-core/libarizona_neo_core.a
            ${{ env.SIM_TEST_BIN }}
            ci/SimRuntimeTests.xcresult
            ci/xcodebuild-test.log
            ci/test-report.txt
            ci/binary-inspection-report.txt
            ci/sha256-manifest.txt
            ci/simulator-devices.json
            ci/simulator-device.txt
            ci/sim-core-configure.log
            ci/sim-core-build.log
            ci/luajit-sim-build.log
            ci/luajit-sim/out-ios-simulator-arm64/build-version.txt
            ci/luajit-sim/out-ios-simulator-arm64/lipo.txt
